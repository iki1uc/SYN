<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>iki1uc Runtime</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas, monospace;
    padding:20px;
}
#runtime {
    background:#111;
    padding:15px;
    border:1px solid #333;
    white-space:pre;
}
</style>
</head>

<body>

<h1>iki1uc Runtime</h1>
<pre id="runtime">Starte Runtime…</pre>

<script type="module">
    import { SYN_Runtime } from "./sync.load.js";
    import { VEC_CORE } from "./VEC_CORE.js";
    import { FLX_CORE } from "./FLX_CORE.js";

    function run() {

        // 1 — SYN (Systemstart)
        const syn = SYN_Runtime();

        // 2 — VEC (Vektorlogik)
        const vec = VEC_CORE(syn);

        // 3 — FLX (Optimierung)
        const flx = FLX_CORE(vec);

        // ARC — Anzeige
        const state = {
            SYN: syn,
            VEC: vec,
            FLX: flx
        };

        document.getElementById("runtime").innerText =
            JSON.stringify(state, null, 2);
    }

    run();
</script>

</body>
</html>
