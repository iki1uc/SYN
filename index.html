<script type="module">
import { FORM_CORE } from "./FORM_CORE.js";
import { FORM_MATRIX } from "./FORM_MATRIX.js";
import { FORM_ENGINE } from "./FORM_ENGINE.js";
import { SYN_CORE } from "./syn.js";

let matrix = FORM_MATRIX(FORM_CORE);
let t = 0;

function LOOP(){
  t += 0.01;

  const form = FORM_ENGINE(matrix, t);

  const mia = { fusion: 60 };
  const echo = { resonance: 40, state: "loud" };

  const syn = SYN_CORE(mia, echo, form);

  document.getElementById("etage").innerText = syn.etage;
  document.getElementById("modul").innerText = syn.modul;
  document.getElementById("aufgabe").innerText = syn.aufgabe;

  requestAnimationFrame(LOOP);
}

LOOP();
</script>
