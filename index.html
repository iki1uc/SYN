<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>AXES – SYN · FLX · VEC · ARC · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; white-space:pre-wrap; }
</style>

<script type="module">

/* 1 — SYN_CORE */
import { SYN_CORE } from "./SYN.js";

/* 3 — FLX_CORE */
import { FLX_CORE } from "./FLX.js";

/* 4 — VEC_CORE */
import { VEC_CORE } from "./VEC.js";

/* 7 — ARC_CORE */
import { ARC_CORE } from "./ARC.js";

/* HUB + ION + MIA + ECHO */
import { HUB_CORE } from "../HUB/HUB.core.js";
import { NC_QUANTUM } from "../NC/NC_Quantum.js";
import { PQ_HYPER } from "../PQ/PQ_Hyper.js";
import { TMP_GHOST } from "../TMP/TMP_Ghost.js";

import { ION_CORE } from "../ION/ion.core.js";
import { MIA_FUSION } from "../MIA/mia.core.js";
import { ECHO_CORE } from "../ECHO/CR.js";

(async function(){

    /* CORE INIT */
    const nc = NC_QUANTUM();
    const pq = PQ_HYPER(nc);
    const tmp = TMP_GHOST(pq);

    const hub = HUB_CORE(nc, pq, tmp);
    const ion = ION_CORE(hub);
    const mia = MIA_FUSION(hub, ion);
    const echo = ECHO_CORE(ion);

    /* ACHSEN */
    const syn = SYN_CORE(mia, echo);
    const flx = FLX_CORE(echo);
    const vec = VEC_CORE(ion);
    const arc = ARC_CORE(ion.pulse, ion.warp, mia.fusion, echo.amplitude);

    /* OUTPUT */
    document.getElementById("syn").innerText =
        JSON.stringify(syn, null, 2);

    document.getElementById("flx").innerText =
        JSON.stringify(flx, null, 2);

    document.getElementById("vec").innerText =
        JSON.stringify(vec, null, 2);

    document.getElementById("arc").innerText =
        JSON.stringify(arc, null, 2);

})();
</script>

</head>

<body>

<h1>AXES – SYN · FLX · VEC · ARC · iki1uc</h1>

<!-- 1 — SYN -->
<div class="block">
    <div class="title">SYN – Synchronisationsachse</div>
    <pre id="syn"></pre>
</div>

<!-- 3 — FLX -->
<div class="block">
    <div class="title">FLX – Flexionsachse</div>
    <pre id="flx"></pre>
</div>

<!-- 4 — VEC -->
<div class="block">
    <div class="title">VEC – Vektorachse</div>
    <pre id="vec"></pre>
</div>

<!-- 7 — ARC -->
<div class="block">
    <div class="title">ARC – Archivachse</div>
    <pre id="arc"></pre>
</div>

</body>
</html>
