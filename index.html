<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPO · WELT · SYN · QUANT · Beweis</title>

<style>
:root {
    --bg: #0a0a12;
    --fg: #0ff;
    --syn: #ff6b6b;
    --quant: #6b6bff;
    --respo: #ffd93d;
    --core: #6cf;
    --gold: #ffd700;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 6px;
    padding: 10px;
}

/* ===== HEADER ===== */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 6px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 20px;
    color: var(--gold);
    text-shadow: 0 0 20px var(--gold);
    letter-spacing: 4px;
}
header h1 span.syn { color: var(--syn); text-shadow: 0 0 20px var(--syn); }
header h1 span.quant { color: var(--quant); text-shadow: 0 0 20px var(--quant); }
header h1 span.respo { color: var(--respo); text-shadow: 0 0 20px var(--respo); }
#info-bar { font-size: 12px; color: #666; display: flex; gap: 16px; align-items: center; }

/* ===== MAIN ===== */
main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 10px;
    height: 100%;
    min-height: 0;
}

/* ===== CANVAS ===== */
#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 12px;
    padding: 6px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    display: block;
}

/* ===== STATUS ===== */
#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    max-height: 100%;
}
#panel h3 { font-size: 12px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 6px; }

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 11px;
    color: #6a6a8a;
    line-height: 1.5;
    min-height: 100px;
    max-height: 300px;
    background: #06060a;
    border-radius: 6px;
    padding: 6px;
}
#log .entry { padding: 2px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.syn { color: var(--syn); }
#log .msg.quant { color: var(--quant); }
#log .msg.respo { color: var(--respo); }
#log .msg.ok { color: #4f4; }
#log .msg.warn { color: #ff4; }
#log .msg.err { color: #f44; }

/* ===== METRIK ===== */
#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
    font-size: 11px;
}
.metric {
    background: #0e0e1a;
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 9px; text-transform: uppercase; }
.metric .value { font-size: 18px; font-weight: bold; }
.metric.syn .value { color: var(--syn); }
.metric.quant .value { color: var(--quant); }
.metric.respo .value { color: var(--respo); }

/* ===== CONTROLS ===== */
#controls {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 4px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button.active { border-color: var(--gold); background: var(--gold); color: #000; }
button.primary { border-color: var(--gold); color: var(--gold); }
button.syn { border-color: var(--syn); color: var(--syn); }
button.syn:hover { background: var(--syn); color: #000; }
button.quant { border-color: var(--quant); color: var(--quant); }
button.quant:hover { background: var(--quant); color: #000; }
button.respo { border-color: var(--respo); color: var(--respo); }
button.respo:hover { background: var(--respo); color: #000; }
button.danger { border-color: #f44; color: #f44; }
button.danger:hover { background: #f44; color: #000; }

/* ===== RESPONSIVE ===== */
@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 300px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
    <h1>
        <span class="respo">◈ RESPO</span>
        <span style="color:#666;">·</span>
        <span class="syn">⟳ SYN</span>
        <span style="color:#666;">·</span>
        <span class="quant">⚛ QUANT</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">Zyklus 0</span>
    </div>
</header>

<!-- ===== MAIN ===== -->
<main>
    <!-- CANVAS -->
    <div id="canvas-wrap">
        <canvas id="respoCanvas"></canvas>
    </div>

    <!-- PANEL -->
    <div id="panel">
        <h3>📊 SYN · QUANT · RESPO</h3>

        <!-- Metriken -->
        <div id="metrics">
            <div class="metric syn">
                <div class="label">SYN · 90°</div>
                <div class="value" id="syn-value">0.00</div>
            </div>
            <div class="metric quant">
                <div class="label">QUANT · 120°</div>
                <div class="value" id="quant-value">0.00</div>
            </div>
            <div class="metric respo">
                <div class="label">RESPO · φ</div>
                <div class="value" id="respo-value">0.00</div>
            </div>
        </div>

        <!-- LOG -->
        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg respo">◈ RESPO · WELT geladen</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg syn">⟳ SYN · 90°-Relation aktiv</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg quant">⚛ QUANT · 120°-Relation aktiv</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">✅ 3×3×3 = 27 Basiseinheiten</span></div>
        </div>

        <!-- CONTROLS -->
        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="syn" id="btn-syn">⟳ SYN</button>
            <button class="quant" id="btn-quant">⚛ QUANT</button>
            <button class="respo" id="btn-respo">◈ RESPO</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<!-- ============================================================ -->
<!-- SCRIPT — RESPO · SYN · QUANT · BEWEIS -->
<!-- ============================================================ -->
<script>
// ============================================================
// 1. KONFIGURATION
// ============================================================
const PHI = 1.61803398875;
const DEG_90 = Math.PI / 2;
const DEG_120 = (2 * Math.PI) / 3;
const DEG_180 = Math.PI;

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('respoCanvas');
const ctx = canvas.getContext('2d');

let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    const dpr = 1; // devicePixelRatio;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';

    W = canvas.width;
    H = canvas.height;
    cx = W / 2;
    cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. STATE
// ============================================================
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,
    synAngle: 0,
    quantAngle: 0,
    respoValue: 0.5,
    synValue: 0.5,
    quantValue: 0.5,
    // 3 Ebenen für RESPO
    levels: [
        { size: 3, label: '3×3', active: true },
        { size: 9, label: '9×9', active: true },
        { size: 27, label: '27×27', active: true }
    ],
    // SYN-Punkte (90°-Relation)
    synPoints: [],
    // QUANT-Punkte (120°-Relation)
    quantPoints: [],
    // RESPO-Kern
    respoCore: { x: 0, y: 0, size: 0 }
};

// ============================================================
// 4. SYN · QUANT · RESPO KERN-FUNKTIONEN
// ============================================================

// SYN: 90°-Relation (orthogonal)
function computeSyn(angle, strength = 1) {
    // 90° = π/2
    const synAngles = [
        angle,
        angle + DEG_90,
        angle + DEG_180,
        angle + DEG_90 * 3
    ];
    return synAngles.map(a => ({
        angle: a,
        x: Math.cos(a) * radius * 0.8 * strength,
        y: Math.sin(a) * radius * 0.8 * strength,
        weight: Math.sin(a + state.t) * 0.5 + 0.5
    }));
}

// QUANT: 120°-Relation (Dreieck)
function computeQuant(angle, strength = 1) {
    // 120° = 2π/3
    const quantAngles = [
        angle,
        angle + DEG_120,
        angle + DEG_120 * 2
    ];
    return quantAngles.map(a => ({
        angle: a,
        x: Math.cos(a) * radius * 0.7 * strength,
        y: Math.sin(a) * radius * 0.7 * strength,
        weight: Math.cos(a + state.t * 0.7) * 0.5 + 0.5
    }));
}

// RESPO: φ-basierte Kern-Einheit
function computeRespo(synVal, quantVal) {
    // φ-Mischung: RESPO = (SYN + QUANT) / φ
    const raw = (synVal + quantVal) / PHI;
    // 3-9-27-Skalierung
    const scaled = raw * (1 + state.cycle * 0.01);
    return Math.min(1, Math.max(0, scaled));
}

// ============================================================
// 5. RENDER LOOP
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund-Gitter (3-9-27)
    drawGrid();

    // SYN-Netz (90°)
    drawSynNetwork();

    // QUANT-Netz (120°)
    drawQuantNetwork();

    // RESPO-Kern
    drawRespoCore();

    // Metriken aktualisieren
    updateMetrics();

    state.t += 0.008;
    if (state.running) {
        state.synAngle += 0.005;
        state.quantAngle += 0.005 * 1.2;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 6. ZEICHEN-FUNKTIONEN
// ============================================================

function drawGrid() {
    // 3-9-27 Gitter
    const sizes = [3, 9, 27];
    const colors = ['#0ff3', '#f0f3', '#ff03'];

    sizes.forEach((size, idx) => {
        const spacing = radius * 0.06 * (27 / size);
        const offset = (size - 1) * spacing / 2;

        ctx.strokeStyle = colors[idx];
        ctx.lineWidth = 0.5;

        for (let i = 0; i < size; i++) {
            const pos = -offset + i * spacing;
            // Vertikal
            ctx.beginPath();
            ctx.moveTo(cx + pos, cy - offset);
            ctx.lineTo(cx + pos, cy + offset);
            ctx.stroke();
            // Horizontal
            ctx.beginPath();
            ctx.moveTo(cx - offset, cy + pos);
            ctx.lineTo(cx + offset, cy + pos);
            ctx.stroke();
        }
    });
}

function drawSynNetwork() {
    const strength = state.synValue;
    const points = computeSyn(state.synAngle, strength);

    // Verbindungen
    ctx.strokeStyle = `rgba(255, 107, 107, ${0.3 + strength * 0.4})`;
    ctx.lineWidth = 1.5;

    for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];

        ctx.beginPath();
        ctx.moveTo(cx + p1.x, cy + p1.y);
        ctx.lineTo(cx + p2.x, cy + p2.y);
        ctx.stroke();

        // 90°-Markierung
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        ctx.fillStyle = `rgba(255, 107, 107, ${0.2 + strength * 0.3})`;
        ctx.font = '8px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText('90°', cx + midX, cy + midY - 10);
    }

    // Punkte
    points.forEach(p => {
        const glow = ctx.createRadialGradient(
            cx + p.x, cy + p.y, 0,
            cx + p.x, cy + p.y, 12
        );
        glow.addColorStop(0, `rgba(255, 107, 107, ${0.8 + p.weight * 0.2})`);
        glow.addColorStop(1, 'rgba(255, 107, 107, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    state.synPoints = points;
}

function drawQuantNetwork() {
    const strength = state.quantValue;
    const points = computeQuant(state.quantAngle, strength);

    // Dreiecke (120°)
    ctx.strokeStyle = `rgba(107, 107, 255, ${0.3 + strength * 0.4})`;
    ctx.lineWidth = 1.5;

    for (let i = 0; i < points.length; i++) {
        const p1 = points[i];
        const p2 = points[(i + 1) % points.length];

        ctx.beginPath();
        ctx.moveTo(cx + p1.x, cy + p1.y);
        ctx.lineTo(cx + p2.x, cy + p2.y);
        ctx.stroke();

        // 120°-Markierung
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        ctx.fillStyle = `rgba(107, 107, 255, ${0.2 + strength * 0.3})`;
        ctx.font = '8px Consolas';
        ctx.textAlign = 'center';
        ctx.fillText('120°', cx + midX, cy + midY + 14);
    }

    // Punkte
    points.forEach(p => {
        const glow = ctx.createRadialGradient(
            cx + p.x, cy + p.y, 0,
            cx + p.x, cy + p.y, 14
        );
        glow.addColorStop(0, `rgba(107, 107, 255, ${0.6 + p.weight * 0.3})`);
        glow.addColorStop(1, 'rgba(107, 107, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(cx + p.x, cy + p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    state.quantPoints = points;
}

function drawRespoCore() {
    const val = state.respoValue;

    // Kern-Schale
    const coreRadius = 15 + val * 35;

    // Äußere Glow
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 30);
    glow.addColorStop(0, `rgba(255, 217, 61, ${0.3 + val * 0.5})`);
    glow.addColorStop(0.5, `rgba(255, 217, 61, ${0.1 + val * 0.2})`);
    glow.addColorStop(1, 'rgba(255, 217, 61, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 30, 0, Math.PI * 2);
    ctx.fill();

    // Kern
    const coreGrad = ctx.createRadialGradient(cx - 5, cy - 5, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(255, 217, 61, ${0.9 + val * 0.1})`);
    coreGrad.addColorStop(0.7, `rgba(255, 200, 50, ${0.6 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(255, 180, 30, ${0.3 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 30 + val * 30;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // RESPO-Symbol
    ctx.fillStyle = '#000';
    ctx.font = `bold ${14 + val * 10}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy - 2);

    // φ-Wert
    ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + val * 0.5})`;
    ctx.font = '10px Consolas';
    ctx.fillText(`φ = ${state.respoValue.toFixed(3)}`, cx, cy + coreRadius + 18);
}

// ============================================================
// 7. METRIKEN
// ============================================================
function updateMetrics() {
    // SYN: 90°-Kohärenz
    const synCoherence = state.synPoints.length > 0
        ? state.synPoints.reduce((sum, p) => sum + p.weight, 0) / state.synPoints.length
        : 0.5;
    state.synValue = 0.7 * state.synValue + 0.3 * synCoherence;

    // QUANT: 120°-Kohärenz
    const quantCoherence = state.quantPoints.length > 0
        ? state.quantPoints.reduce((sum, p) => sum + p.weight, 0) / state.quantPoints.length
        : 0.5;
    state.quantValue = 0.7 * state.quantValue + 0.3 * quantCoherence;

    // RESPO: φ-Mischung
    state.respoValue = computeRespo(state.synValue, state.quantValue);

    // DOM aktualisieren
    document.getElementById('syn-value').textContent = state.synValue.toFixed(3);
    document.getElementById('quant-value').textContent = state.quantValue.toFixed(3);
    document.getElementById('respo-value').textContent = state.respoValue.toFixed(3);
}

// ============================================================
// 8. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${type}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 100) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 9. CONTROLS
// ============================================================
document.getElementById('btn-start').addEventListener('click', () => {
    state.running = !state.running;
    document.getElementById('btn-start').textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ System gestartet' : '⏸ System gestoppt', state.running ? 'ok' : 'warn');
});

document.getElementById('btn-syn').addEventListener('click', () => {
    state.synValue = Math.min(1, state.synValue + 0.1);
    log(`⟳ SYN auf ${state.synValue.toFixed(2)} verstärkt`, 'syn');
});

document.getElementById('btn-quant').addEventListener('click', () => {
    state.quantValue = Math.min(1, state.quantValue + 0.1);
    log(`⚛ QUANT auf ${state.quantValue.toFixed(2)} verstärkt`, 'quant');
});

document.getElementById('btn-respo').addEventListener('click', () => {
    state.respoValue = computeRespo(state.synValue, state.quantValue);
    log(`◈ RESPO neu berechnet: ${state.respoValue.toFixed(3)}`, 'respo');
});

document.getElementById('btn-reset').addEventListener('click', () => {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.synValue = 0.5;
    state.quantValue = 0.5;
    state.respoValue = 0.5;
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'Zyklus 0';
    document.getElementById('syn-value').textContent = '0.500';
    document.getElementById('quant-value').textContent = '0.500';
    document.getElementById('respo-value').textContent = '0.500';
    log('⟲ RESET — System zurückgesetzt', 'warn');
});

document.getElementById('btn-auto').addEventListener('click', () => {
    state.autoMode = !state.autoMode;
    document.getElementById('btn-auto').textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO-Modus aktiv — SYN/QUANT/RESPO oszillieren', 'warn');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';

        // Automatische Zyklen
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(() => {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `Zyklus ${state.cycle}`;
            // SYN/QUANT oszillieren
            state.synValue = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(state.cycle * 0.3));
            state.quantValue = 0.3 + 0.7 * (0.5 + 0.5 * Math.cos(state.cycle * 0.25));
            state.respoValue = computeRespo(state.synValue, state.quantValue);
            log(`🔄 Zyklus ${state.cycle}: SYN=${state.synValue.toFixed(2)} QUANT=${state.quantValue.toFixed(2)} RESPO=${state.respoValue.toFixed(2)}`, 'warn');
        }, 2500);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO-Modus pausiert', 'warn');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

// ============================================================
// 10. TASTATUR
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 's' || e.key === 'S') document.getElementById('btn-syn').click();
    if (e.key === 'q' || e.key === 'Q') document.getElementById('btn-quant').click();
    if (e.key === 'r' || e.key === 'R') document.getElementById('btn-respo').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-auto').click();
});

// ============================================================
// 11. UHR
// ============================================================
function updateClock() {
    document.getElementById('clock').textContent = `⏱️ ${new Date().toLocaleTimeString()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// 12. INIT
// ============================================================
